name: EDITH APK Build

on:
  push:
    branches: [ ana ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1'

      - name: Wrapper JAR indir
        run: |
          mkdir -p gradle/wrapper
          curl -o gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.1.0/gradle/wrapper/gradle-wrapper.jar
          curl -o gradlew \
            https://raw.githubusercontent.com/gradle/gradle/v8.1.0/gradlew
          chmod +x gradlew

      - name: APK derle
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EDITH-APK
          path: app/build/outputs/apk/debug/app-debug.apk
